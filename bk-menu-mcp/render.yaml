services:
  - type: web
    name: bk-menu-mcp
    runtime: python
    rootDir: bk-menu-mcp
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run server.py
    healthCheckPath: /mcp
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false   # you'll paste this in the Render dashboard
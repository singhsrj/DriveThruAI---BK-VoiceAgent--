name: Agent CI

on:
  push:
    branches: [main]
    paths: ["bk-livekit-agent-cloud/**", ".github/workflows/agent-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["bk-livekit-agent-cloud/**", ".github/workflows/agent-ci.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bk-livekit-agent-cloud
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: Unit tests
        run: uv run pytest -q
